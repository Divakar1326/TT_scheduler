[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --no-header
    -p no:warnings
    -p no:playwright
    --timeout=60
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    ui: marks tests as requiring browser (Playwright)
    api: marks tests as pure API tests
